name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # ЭТО ВКЛЮЧАЕТ КНОПКУ "Run workflow"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up JDK 17
      uses: actions/setup-java@v3
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v2

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: ./gradlew assembleRelease

    - name: Sign APK (if keystore exists)
      uses: r0adkll/sign-android-release@v1
      id: sign_app
      with:
        releaseDirectory: app/build/outputs/apk/release
        signingKeyBase64: ${{ secrets.SIGNING_KEY }}
        alias: ${{ secrets.ALIAS }}
        keyStorePassword: ${{ secrets.KEY_STORE_PASSWORD }}
        keyPassword: ${{ secrets.KEY_PASSWORD }}
      continue-on-error: true

    - name: Verify APK signature
      id: verify_apk
      run: |
        if [ -f "app/build/outputs/apk/release/app-release.apk" ]; then
          echo "APK found, verifying signature..."
          keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk
          echo "APK verification completed successfully!"
        else
          echo "APK not found, skipping verification..."
        fi
      continue-on-error: true

    - name: Create Release
      id: create_release
      uses: softprops/action-gh-release@v1
      with:
        name: TorrPlayer ${{ github.ref_name }}
        draft: false
        prerelease: false
        generate_release_notes: true
        files: |
          app/build/outputs/apk/release/app-release.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      continue-on-error: true

    - name: Upload APK as artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-release
        path: app/build/outputs/apk/release/app-release.apk
