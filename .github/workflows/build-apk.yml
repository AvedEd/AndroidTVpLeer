name: Build and Release APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          cd $GITHUB_WORKSPACE
          gradle assembleRelease

      # === НОВЫЙ ШАГ: ПОКАЗЫВАЕМ, ЧТО БЫЛО СОЗДАНО ===
      - name: List generated files
        run: |
          echo "=== Содержимое папки release ==="
          ls -la app/build/outputs/apk/release/ || echo "Папка release пуста или не существует"
          echo ""
          echo "=== Содержимое папки debug ==="
          ls -la app/build/outputs/apk/debug/ || echo "Папка debug пуста или не существует"
          echo ""
          echo "=== Поиск всех APK-файлов ==="
          find app/build/outputs/apk/ -name "*.apk" || echo "APK-файлы не найдены"

      # === ЗАГРУЖАЕМ НАЙДЕННЫЙ APK ===
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          # Используем wildcard, чтобы найти любой APK
          path: app/build/outputs/apk/**/*.apk

      - name: Create and Upload Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TorrPlayer build ${{ github.run_number }}
          # Используем wildcard
          files: app/build/outputs/apk/**/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
