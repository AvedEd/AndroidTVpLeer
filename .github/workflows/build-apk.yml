name: Build TorrPlayer APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode release keystore
        run: echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > release.keystore

      - name: Build release APK
        run: |
          gradle assembleRelease \
            -PversionCode=${{ github.run_number }} \
            -PRELEASE_STORE_FILE=${{ github.workspace }}/release.keystore \
            -PRELEASE_STORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }} \
            -PRELEASE_KEY_ALIAS=${{ secrets.KEY_ALIAS }} \
            -PRELEASE_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }} \
            --stacktrace

      - name: Remove keystore from runner
        if: always()
        run: rm -f release.keystore

      - name: Print signing certificate fingerprint (для сверки между сборками)
        run: keytool -printcert -jarfile app/build/outputs/apk/release/app-release.apk

      - name: Upload build artifact (backup download route)
        uses: actions/upload-artifact@v4
        with:
          name: TorrPlayer-release-apk
          path: app/build/outputs/apk/release/app-release.apk

      - name: Publish GitHub Release with direct APK link
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: TorrPlayer build ${{ github.run_number }}
          files: app/build/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
